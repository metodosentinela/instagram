<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Maker · Método Sentinela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --navy:#002B5C; --lima:#CBD12E; --creme:#F4EDE0; --cremesoft:#FAF6EE;
  --grafite:#2C3A47; --ferrugem:#C1441E; --ink:#0F1419;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',sans-serif;background:var(--ink);color:#E8E4DC;font-weight:300;overflow-x:hidden}

/* ============= APP SHELL ============= */
.app{display:grid;grid-template-columns:1fr 380px;min-height:100vh}
.workspace{padding:24px 28px 200px;overflow-x:hidden}
.controls{position:sticky;top:0;right:0;height:100vh;background:#161B22;border-left:1px solid rgba(255,255,255,.08);padding:22px 20px;overflow-y:auto}

.app-head{margin-bottom:28px}
.app-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:-.02em;margin-bottom:4px}
.app-title em{color:var(--lima);font-style:italic;font-weight:600}
.app-sub{font-size:13px;opacity:.65;line-height:1.5;max-width:760px;margin-bottom:14px}

.app-tabs{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.app-tab{padding:9px 16px;background:transparent;color:#E8E4DC;border:1px solid rgba(255,255,255,.12);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:all .2s}
.app-tab:hover{border-color:rgba(255,255,255,.3)}
.app-tab.active{background:var(--lima);color:var(--navy);border-color:var(--lima);font-weight:700}

/* ============= POST CARD ============= */
.post{margin-bottom:36px;background:#1A1F26;border-radius:14px;padding:24px;border:1px solid rgba(255,255,255,.05);transition:border-color .2s}
.post.selected{border-color:rgba(203,209,46,.4)}
.post-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.post-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post-meta h2{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.01em}
.post-meta h2 .ptag{margin-right:6px}
.post-meta .meta-sub{font-size:12px;opacity:.5}
.post-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 14px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:7px;font-family:inherit;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35)}
.btn.primary{background:var(--lima);color:var(--navy);border-color:var(--lima);font-weight:700}
.btn.primary:hover{background:#dde640}
.btn.danger:hover{background:var(--ferrugem);border-color:var(--ferrugem);color:#fff}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.btn-icon-sm{width:26px;height:26px;font-size:12px}

/* ============= SLIDES ROW ============= */
.slides{display:flex;gap:14px;overflow-x:auto;padding:4px 0 16px;align-items:flex-start}
.slides::-webkit-scrollbar{height:8px}
.slides::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:8px}
.slides::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
.slide-wrap{flex-shrink:0}
.slide-toolbar{display:flex;align-items:center;gap:4px;margin-bottom:6px;padding:0 2px;height:24px;font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.1em}
.slide-toolbar .idx{color:var(--lima);font-weight:700;opacity:1;margin-right:4px}
.slide-toolbar .layout-name{opacity:.5}
.slide-toolbar-spacer{flex:1}
.slide-frame{overflow:hidden;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.4);position:relative;transition:box-shadow .2s, transform .2s;cursor:pointer}
.slide-frame.selected{box-shadow:0 0 0 3px var(--lima),0 8px 24px rgba(0,0,0,.5)}
.slide-frame.feed{width:280px;height:350px}
.slide-frame.story{width:200px;height:356px}
.slide-frame.feed .slide{transform:scale(0.2593);transform-origin:top left}
.slide-frame.story .slide{transform:scale(0.1852);transform-origin:top left}
.slide-add{flex-shrink:0;width:120px;height:350px;border:2px dashed rgba(255,255,255,.15);border-radius:8px;background:transparent;color:rgba(255,255,255,.5);font-family:inherit;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;transition:all .2s;margin-top:30px}
.slide-add:hover{border-color:var(--lima);color:var(--lima);background:rgba(203,209,46,.06)}
.slide-add .plus{font-size:32px;font-weight:300;line-height:1}

/* ============= SLIDE CANVAS ============= */
.slide{position:relative;overflow:hidden;font-family:'Outfit',sans-serif;--text-scale:1;--ts-headline:1;--ts-lead:1;--ts-body:1;--ts-eyebrow:1;--ts-label:1;--ts-numero:1;--ts-sub:1;--ts-footer:1;--ts-quote:1;--ts-attribution:1;--ts-nome:1;--ts-papel:1;--ts-bio:1;--ts-cred:1;--ts-row:1;--ts-item:1;--ts-bigword:1;--ts-leftWord:1;--ts-rightWord:1;--ts-cta:1}
.slide.feed{width:1080px;height:1350px}
.slide.story{width:1080px;height:1920px}
.slide [contenteditable]{outline:none}
.slide [contenteditable]:focus{outline:2px dashed rgba(203,209,46,.6);outline-offset:4px;border-radius:2px}

/* photo overlay layer */
.slide-photo{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center 50%;z-index:0;pointer-events:none}
.slide-photo-darken{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1;pointer-events:none}
.slide-content-wrap{position:relative;z-index:2;width:100%;height:100%}

/* ============= BACKGROUNDS ============= */
.bg-navy{background:var(--navy);color:var(--creme)}
.bg-creme{background:var(--creme);color:var(--navy)}
.bg-white{background:#FFFFFF;color:var(--navy)}
.bg-cremesoft{background:var(--cremesoft);color:var(--navy)}
.bg-grafite{background:var(--grafite);color:var(--creme)}
.bg-split{background:linear-gradient(180deg,#F0E5D5 50%,var(--navy) 50%);color:var(--navy)}
.bg-verde-escuro{background:#1F3829;color:var(--creme)}
.bg-verde-musk{background:#5A6D3E;color:var(--creme)}
.bg-verde-sage{background:#A8B89B;color:var(--navy)}
.bg-ferrugem{background:var(--ferrugem);color:var(--creme)}

/* ============= ORNAMENT OVERLAY ============= */
.slide-ornament{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.18}
.bg-creme .slide-ornament, .bg-white .slide-ornament, .bg-cremesoft .slide-ornament, .bg-verde-sage .slide-ornament{opacity:.10}
.has-photo .slide-ornament{opacity:.25}
.slide-ornament svg{width:100%;height:100%;display:block}

/* When there's a photo, the text needs cream/white treatment */
.has-photo{color:#fff}
.has-photo.bg-creme, .has-photo.bg-white, .has-photo.bg-cremesoft{color:#fff}
.has-photo .l-manifesto .headline,
.has-photo .l-capa-numero .headline,
.has-photo .l-capa-numero .label,
.has-photo .l-cta-final .headline,
.has-photo .l-cta-final .sub,
.has-photo .l-cta-final .eyebrow,
.has-photo .l-manifesto .foot-line{color:#fff !important}

/* ============= SIGNATURE FOOT ============= */
.slide-foot{position:absolute;bottom:64px;left:88px;right:88px;display:flex;justify-content:space-between;align-items:center;gap:24px;z-index:5}
.slide.story .slide-foot{bottom:80px}
.slide-foot.sig-top{bottom:auto;top:64px}
.slide-foot.sig-hidden{display:none}
.slide-logo{height:calc(88px * var(--text-scale));width:auto;display:block}
.bg-navy .slide-logo, .bg-grafite .slide-logo, .has-photo .slide-logo, .bg-verde-escuro .slide-logo, .bg-verde-musk .slide-logo, .bg-ferrugem .slide-logo{filter:brightness(0) invert(1) !important}
.slide-foot-text{font-weight:600;font-size:calc(28px * var(--text-scale));letter-spacing:.02em;line-height:1;text-align:right;opacity:.95}
.bg-navy .slide-foot-text, .bg-grafite .slide-foot-text, .has-photo .slide-foot-text, .bg-verde-escuro .slide-foot-text, .bg-verde-musk .slide-foot-text, .bg-ferrugem .slide-foot-text{color:var(--lima)}
.bg-creme .slide-foot-text, .bg-cremesoft .slide-foot-text, .bg-white .slide-foot-text, .bg-verde-sage .slide-foot-text{color:var(--ferrugem)}
.bg-split .slide-foot-text{color:var(--lima)}
.bg-split .slide-logo{filter:brightness(0) invert(1)}

/* big background S */
.slide-mark{position:absolute;font-weight:800;line-height:.8;letter-spacing:-.05em;pointer-events:none;user-select:none;z-index:1}
.bg-navy .slide-mark, .bg-grafite .slide-mark, .bg-verde-escuro .slide-mark, .bg-verde-musk .slide-mark, .bg-ferrugem .slide-mark{color:var(--creme);opacity:.04}
.bg-creme .slide-mark, .bg-cremesoft .slide-mark, .bg-verde-sage .slide-mark{color:var(--navy);opacity:.04}
.bg-white .slide-mark{color:var(--navy);opacity:.03}
.has-photo .slide-mark{display:none}

/* em styling — solid lima with proper line height */
em{font-style:italic;font-weight:inherit}
/* Default em: refined italic accent, NO tarja */
.headline em, .lead em, .quote em, .big-word em, .nome em{color:var(--ferrugem);font-weight:inherit;background:transparent;padding:0;display:inline}
.bg-navy .headline em, .bg-navy .lead em, .bg-navy .quote em,
.bg-grafite .headline em, .bg-grafite .lead em, .bg-grafite .quote em,
.bg-verde-escuro .headline em, .bg-verde-escuro .lead em, .bg-verde-escuro .quote em,
.bg-verde-musk .headline em, .bg-verde-musk .lead em, .bg-verde-musk .quote em,
.bg-ferrugem .headline em, .bg-ferrugem .lead em, .bg-ferrugem .quote em, .bg-ferrugem .big-word em, .bg-ferrugem .nome em,
.has-photo .headline em, .has-photo .lead em, .has-photo .quote em{color:var(--lima);background:transparent;padding:0;display:inline}
/* OPT-IN: tarja via **palavra** syntax */
em.tarja, em[data-tarja]{background:var(--lima)!important;color:var(--navy)!important;padding:0 12px!important;display:inline-block!important;line-height:.98!important}
.bg-navy em.tarja, .bg-navy em[data-tarja],
.bg-verde-escuro em.tarja, .bg-verde-escuro em[data-tarja],
.bg-ferrugem em.tarja, .bg-ferrugem em[data-tarja]{color:var(--navy)!important}

/* ============= LAYOUT: manifesto ============= */
.l-manifesto{display:flex;flex-direction:column;justify-content:center;padding:140px 88px 280px;width:100%;height:100%;position:relative}
.l-manifesto .slide-mark{font-size:calc(1300px * 1);top:50%;left:-160px;transform:translateY(-40%)}
.l-manifesto .headline{font-weight:700;font-size:calc(124px * var(--text-scale) * var(--ts-headline,1));line-height:1;letter-spacing:-.04em;position:relative;z-index:2;max-width:920px;word-break:keep-all}
.l-manifesto .foot-line{position:relative;z-index:2;margin-top:48px;font-size:calc(32px * var(--text-scale) * var(--ts-footer,1));font-weight:300;font-style:italic;opacity:.75;letter-spacing:-.005em}

/* ============= LAYOUT: capa-numero ============= */
.l-capa-numero{padding:120px 88px 280px;display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%;position:relative}
.l-capa-numero .label{font-weight:700;font-size:calc(24px * var(--text-scale) * var(--ts-label,1));letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px}
.bg-navy .l-capa-numero .label{color:var(--lima)}
.bg-ferrugem .l-capa-numero .label{color:var(--lima)}
.bg-creme .l-capa-numero .label, .bg-white .l-capa-numero .label, .bg-cremesoft .l-capa-numero .label{color:var(--ferrugem)}
.l-capa-numero .numero{font-weight:800;font-size:calc(280px * var(--text-scale) * var(--ts-numero,1));line-height:.85;letter-spacing:-.05em;margin-bottom:48px;position:relative;z-index:2;white-space:nowrap}
.bg-navy .l-capa-numero .numero{color:var(--lima)}
.bg-ferrugem .l-capa-numero .numero{color:var(--lima)}
.bg-creme .l-capa-numero .numero, .bg-white .l-capa-numero .numero, .bg-cremesoft .l-capa-numero .numero{color:var(--navy)}
.l-capa-numero .numero.small{font-size:calc(160px * var(--text-scale) * var(--ts-numero,1));line-height:.95}
.l-capa-numero .headline{font-weight:600;font-size:calc(78px * var(--text-scale) * var(--ts-headline,1));line-height:1.04;letter-spacing:-.03em;max-width:880px;position:relative;z-index:2;word-break:keep-all}
.l-capa-numero .sub{font-weight:400;font-size:calc(30px * var(--text-scale) * var(--ts-sub,1));line-height:1.4;margin-top:28px;opacity:.85;max-width:780px;position:relative;z-index:2}

/* ============= LAYOUT: capa-blocos ============= */
.l-capa-blocos{padding:0;width:100%;height:100%;display:grid;grid-template-rows:1fr 1fr;position:relative}
.l-capa-blocos .block{padding:88px 88px;display:flex;align-items:center;position:relative}
.l-capa-blocos .block-left{background:#F0E5D5;color:var(--ferrugem);justify-content:flex-start}
.l-capa-blocos .block-right{background:var(--navy);color:var(--lima);justify-content:flex-end;text-align:right}
.l-capa-blocos .big-word{font-weight:800;font-size:calc(160px * var(--text-scale) * var(--ts-bigword,1));line-height:.92;letter-spacing:-.04em;text-transform:uppercase}
.l-capa-blocos .block-left .big-word{font-size:calc(160px * var(--text-scale) * var(--ts-leftWord, var(--ts-bigword,1)))}
.l-capa-blocos .block-right .big-word{font-size:calc(160px * var(--text-scale) * var(--ts-rightWord, var(--ts-bigword,1)))}
.l-capa-blocos .foot-line{position:absolute;left:88px;right:88px;top:50%;transform:translateY(-50%);font-size:calc(32px * var(--text-scale) * var(--ts-footer,1));font-weight:500;font-style:italic;color:#fff;opacity:.95;text-align:center;z-index:3;background:rgba(0,43,92,.85);padding:18px 36px;border-radius:999px;display:inline-block;width:fit-content;left:50%;transform:translate(-50%,-50%)}

/* ============= LAYOUT: comparacao-x ============= */
.l-comparacao-x{padding:0;display:flex;flex-direction:column;width:100%;height:100%}
.l-comparacao-x .head-bar{padding:56px 88px 0;display:flex;justify-content:center;align-items:center;gap:24px;background:#fff}
.l-comparacao-x .head-bar-title{font-weight:700;font-size:calc(30px * var(--text-scale) * var(--ts-label,1));letter-spacing:.16em;text-transform:uppercase;color:var(--grafite);opacity:.65}
.l-comparacao-x .vs{font-weight:300;font-style:italic;font-size:calc(26px * var(--text-scale));opacity:.4}
.l-comparacao-x .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;margin-top:40px}
.l-comparacao-x .col{padding:48px 52px 240px;display:flex;flex-direction:column}
.l-comparacao-x .col-left{background:#F0E5D5;color:var(--grafite)}
.l-comparacao-x .col-right{background:var(--navy);color:var(--creme)}
.l-comparacao-x .col-head{display:flex;align-items:center;gap:24px;margin-bottom:48px;padding-bottom:24px;border-bottom:2px solid currentColor}
.l-comparacao-x .col-icon{flex-shrink:0;width:80px;height:80px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;line-height:1}
.l-comparacao-x .col-left .col-icon{background:var(--ferrugem);color:#fff}
.l-comparacao-x .col-right .col-icon{background:var(--lima);color:var(--navy)}
.l-comparacao-x .col-title{font-weight:900;font-size:calc(78px * var(--text-scale) * var(--ts-headline,1));line-height:1;letter-spacing:-.03em}
.l-comparacao-x .col-left .col-title{color:var(--ferrugem)}
.l-comparacao-x .col-right .col-title{color:var(--lima)}
.l-comparacao-x .row{font-weight:600;font-size:calc(36px * var(--text-scale) * var(--ts-row,1));line-height:1.34;letter-spacing:-.005em;padding:24px 0;border-bottom:1px solid rgba(0,0,0,.1)}
.l-comparacao-x .col-right .row{border-color:rgba(244,237,224,.18)}
.l-comparacao-x .row:last-child{border-bottom:none}
.l-comparacao-x .col-left .row{opacity:.85}

/* ============= LAYOUT: lista-numerada ============= */
.l-lista-numerada{padding:120px 88px 280px;display:flex;flex-direction:column;width:100%;height:100%;position:relative}
.l-lista-numerada .eyebrow{font-weight:700;font-size:calc(22px * var(--text-scale) * var(--ts-eyebrow,1));letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px;display:flex;align-items:center;gap:18px}
.l-lista-numerada .eyebrow::before{content:"";width:48px;height:2px;background:currentColor}
.bg-navy .l-lista-numerada .eyebrow{color:var(--lima)}
.bg-creme .l-lista-numerada .eyebrow, .bg-white .l-lista-numerada .eyebrow, .bg-cremesoft .l-lista-numerada .eyebrow{color:var(--ferrugem)}
.l-lista-numerada .headline{font-weight:600;font-size:calc(66px * var(--text-scale) * var(--ts-headline,1));line-height:1.06;letter-spacing:-.03em;margin-bottom:48px;max-width:860px;word-break:keep-all}
.l-lista-numerada .items{display:flex;flex-direction:column}
.l-lista-numerada .item{display:flex;align-items:flex-start;gap:32px;padding:26px 0;border-bottom:1px solid rgba(0,0,0,.1)}
.bg-navy .l-lista-numerada .item{border-color:rgba(244,237,224,.2)}
.l-lista-numerada .item:last-child{border-bottom:none}
.l-lista-numerada .item-num{font-weight:800;font-size:calc(38px * var(--text-scale) * var(--ts-item,1));letter-spacing:.02em;flex-shrink:0;width:80px;line-height:1.1}
.bg-navy .l-lista-numerada .item-num{color:var(--lima)}
.bg-creme .l-lista-numerada .item-num, .bg-white .l-lista-numerada .item-num{color:var(--ferrugem)}
.l-lista-numerada .item-text{font-weight:500;font-size:calc(36px * var(--text-scale) * var(--ts-item,1));line-height:1.34;letter-spacing:-.005em;flex:1}
.l-lista-numerada .foot-text{margin-top:36px;font-weight:300;font-style:italic;font-size:calc(28px * var(--text-scale) * var(--ts-footer,1));line-height:1.4;opacity:.75}

/* ============= LAYOUT: pull-quote ============= */
.l-pull-quote{padding:140px 88px 280px;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;position:relative}
.l-pull-quote .slide-mark{font-size:calc(1100px * 1);bottom:-160px;right:-180px}
.l-pull-quote .quote-mark{font-weight:400;font-size:calc(140px * var(--text-scale) * var(--ts-quote,1));line-height:.6;margin-bottom:32px;position:relative;z-index:2}
.bg-creme .l-pull-quote .quote-mark, .bg-cremesoft .l-pull-quote .quote-mark{color:var(--ferrugem)}
.bg-navy .l-pull-quote .quote-mark{color:var(--lima)}
.bg-white .l-pull-quote .quote-mark{color:var(--ferrugem)}
.l-pull-quote .quote{font-weight:500;font-size:calc(96px * var(--text-scale) * var(--ts-quote,1));line-height:1.04;letter-spacing:-.035em;margin-bottom:48px;position:relative;z-index:2;max-width:880px;word-break:keep-all}
.l-pull-quote .attribution{font-weight:500;font-size:calc(30px * var(--text-scale) * var(--ts-attribution,1));letter-spacing:.08em;text-transform:uppercase;position:relative;z-index:2}
.bg-creme .l-pull-quote .attribution, .bg-cremesoft .l-pull-quote .attribution{color:var(--ferrugem)}
.bg-navy .l-pull-quote .attribution{color:var(--lima)}

/* ============= LAYOUT: texto-corrido ============= */
.l-texto-corrido{padding:120px 88px 280px;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;position:relative}
.l-texto-corrido .eyebrow{font-weight:700;font-size:calc(22px * var(--text-scale) * var(--ts-eyebrow,1));letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px;display:flex;align-items:center;gap:18px}
.l-texto-corrido .eyebrow::before{content:"";width:48px;height:2px;background:currentColor}
.bg-navy .l-texto-corrido .eyebrow{color:var(--lima)}
.bg-creme .l-texto-corrido .eyebrow, .bg-white .l-texto-corrido .eyebrow, .bg-cremesoft .l-texto-corrido .eyebrow{color:var(--ferrugem)}

.ctrl-head{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lima);margin-bottom:6px}

<body>
<div class="app">
  <div class="workspace">
    <div class="app-head">
      <h1 class="app-title">Sentinela · <em>Post Maker</em></h1>
      <p class="app-sub">Clique num slide pra abrir os controles. Edite os textos direto. Use *palavra* pra destaque com tarja lima. Suas mudanças salvam automaticamente no navegador.</p>
      <div class="app-tabs">
        <button class="app-tab active" data-tab="feed">Feed (1080×1350)</button>
        <button class="app-tab" data-tab="stories">Stories (1080×1920)</button>
        <button class="app-tab" onclick="resetAllToOriginal()" style="margin-left:auto;background:transparent;color:#C1441E;border-color:rgba(193,68,30,.5)" title="Volta ao estado inicial dos 6 posts originais">↺ Restaurar 6 posts originais</button>

// localStorage persistence
const STORAGE_KEY = 'sentinela_postmaker_v8';
// Old keys: sentinela_postmaker_v4. Bumping invalidates stale states with old bugs.
function saveState(){
  try {
    // Strip large photo data URLs before saving? They can be big.
    // For now save everything but compress later if needed.
    localStorage.setItem(STORAGE_KEY, JSON.stringify({posts:STATE.posts, stories:STATE.stories}));
  } catch(e){ console.warn('Save failed:', e); }
}
function loadState(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved){
      const s = JSON.parse(saved);
      if (s.posts) STATE.posts = s.posts;
      if (s.stories) STATE.stories = s.stories;
    }
  } catch(e){ console.warn('Load failed:', e); }
}

// ====================== ASTERISK ITALIC ======================
function asteriskToItalic(text){
  if (!text) return text;
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<em data-tarja="1">$1</em>');
  text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  return text;
}
function italicToAsterisk(html){
  if (!html) return html;
  html = html.replace(/<em data-tarja=["']?1["']?>([^<]+)<\/em>/g, '**$1**');
  html = html.replace(/<em>([^<]+)<\/em>/g, '*$1*');
  return html;
}

// ====================== ORNAMENTS (decorative backgrounds) ======================
// Auto-color: lima on dark bgs, navy on light bgs, lima on photo
function ornamentColor(bg, hasPhoto){
  if (hasPhoto) return '#CBD12E';
  const dark = ['navy','grafite','verde-escuro','verde-musk','ferrugem'];
  return dark.includes(bg) ? '#CBD12E' : '#002B5C';
}
function renderOrnament(kind, bg, hasPhoto){
  if (!kind || kind === 'none') return '';
  const c = ornamentColor(bg, hasPhoto);
  let svg = '';
  switch(kind){
    case 'dots':
      // Diagonal dot field
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs><pattern id="op-dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
          <circle cx="30" cy="30" r="3" fill="${c}"/>
        </pattern></defs>
        <rect width="1080" height="1350" fill="url(#op-dots)"/>
      </svg>`;
      break;
    case 'grid':
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs><pattern id="op-grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M 80 0 L 0 0 0 80" fill="none" stroke="${c}" stroke-width="1.2"/>
        </pattern></defs>
        <rect width="1080" height="1350" fill="url(#op-grid)"/>
      </svg>`;
      break;
    case 'lines':
      // Diagonal hatch
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs><pattern id="op-lines" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="40" stroke="${c}" stroke-width="1.5"/>
        </pattern></defs>
        <rect width="1080" height="1350" fill="url(#op-lines)"/>
      </svg>`;
      break;
    case 'circles':
      // Concentric circles in corners
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="${c}" stroke-width="2">
          <circle cx="-50" cy="-50" r="180"/><circle cx="-50" cy="-50" r="280"/><circle cx="-50" cy="-50" r="380"/>
          <circle cx="1130" cy="1400" r="180"/><circle cx="1130" cy="1400" r="280"/><circle cx="1130" cy="1400" r="380"/>
        </g>
      </svg>`;
      break;
    case 'crosshatch':
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs><pattern id="op-cross" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M 0 25 L 50 25 M 25 0 L 25 50" stroke="${c}" stroke-width="1" fill="none"/>
        </pattern></defs>
        <rect width="1080" height="1350" fill="url(#op-cross)"/>
      </svg>`;
      break;
    case 'waves':
      // Horizontal wavy lines
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="${c}" stroke-width="2">
          ${Array.from({length:14}).map((_,i)=>{
            const y = 100 + i*100;
            return `<path d="M 0 ${y} Q 270 ${y-30} 540 ${y} T 1080 ${y}"/>`;
          }).join('')}
        </g>
      </svg>`;
      break;
    case 'frame':
      // Editorial border frame with corner marks
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="${c}" stroke-width="2">
          <rect x="40" y="40" width="1000" height="1270"/>
          <line x1="40" y1="120" x2="1040" y2="120"/>
          <line x1="40" y1="1230" x2="1040" y2="1230"/>
        </g>
        <g fill="${c}">
          <circle cx="40" cy="40" r="6"/><circle cx="1040" cy="40" r="6"/>
          <circle cx="40" cy="1310" r="6"/><circle cx="1040" cy="1310" r="6"/>
        </g>
      </svg>`;
      break;
    case 'arch':
      // Big arch / cathedral shape
      svg = `<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="${c}" stroke-width="3">
          <path d="M 140 1350 L 140 540 Q 540 140 940 540 L 940 1350"/>
          <path d="M 240 1350 L 240 600 Q 540 280 840 600 L 840 1350"/>
          <path d="M 340 1350 L 340 660 Q 540 420 740 660 L 740 1350"/>
        </g>
      </svg>`;
      break;
  }
  return `<div class="slide-ornament" data-ornament="${kind}">${svg}</div>`;
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

function getSlide(key){
  const [type, postId, slideId] = key.split(':');
  if (type === 'feed'){
    const post = STATE.posts.find(p => p.id === postId);
    if (!post) return null;
    return post.slides.find(s => s.id === slideId);
  } else {
    return STATE.stories.find(s => s.id === postId); // postId here is storyId
  }
}

function getPost(postId){
  return STATE.posts.find(p => p.id === postId);
}

const ALL_TS_KEYS = ['headline','lead','body','eyebrow','label','numero','sub','footer','quote','attribution','nome','papel','bio','cred','row','item','bigword','cta'];

function buildSlideStyle(slide){
  const sizes = slide.textSizes || {};
  let s = '--text-scale:' + (slide.textScale || 1) + ';';
  for (const k of ALL_TS_KEYS){
    s += '--ts-' + k + ':' + (sizes[k] || 1) + ';';
  }
  return s;
}

function applyHideAndColor(slideEl, slide){
  if (slide.hidden){
    for (const fld in slide.hidden){
      if (slide.hidden[fld]){
        slideEl.querySelectorAll('[data-field="' + fld + '"]').forEach(el => {
          el.style.display = 'none';
        });
      }
    }
  }
  if (slide.colors){
    for (const fld in slide.colors){
      const c = slide.colors[fld];
      if (c && c !== 'auto'){
        slideEl.querySelectorAll('[data-field="' + fld + '"]').forEach(el => {
          el.style.color = COLOR_MAP[c] || c;
        });
      }
    }
  }
}

      {key:'headline', label:'Headline'},
      {key:'sub', label:'Subtítulo'}
    ];
    case 'centered': return [
      {key:'eyebrow', label:'Eyebrow'},
      {key:'headline', label:'Headline'},
      {key:'body', label:'Corpo'}
    ];
    default: return [];
  }
}

function buildSlideEl(post, slide, slideIdx, totalSlides, isStory){
  const key = isStory ? `story:${slide.id}:0` : `feed:${post.id}:${slide.id}`;
  const wrap = document.createElement('div');
  wrap.className = 'slide-wrap';
  wrap.dataset.key = key;
  
  const moveLeftDisabled = slideIdx === 0;
  const moveRightDisabled = slideIdx === totalSlides - 1;
  
  wrap.innerHTML = `
    <div class="slide-toolbar">
      <span class="idx">${slideIdx+1}</span>
      <span class="layout-name">${slide.layout}</span>
      <span class="slide-toolbar-spacer"></span>
      ${!isStory ? `
        <button class="btn btn-icon btn-icon-sm" onclick="moveSlide('${post.id}','${slide.id}',-1)" title="Mover ←" ${moveLeftDisabled?'disabled style="opacity:.3"':''}>‹</button>
        <button class="btn btn-icon btn-icon-sm" onclick="moveSlide('${post.id}','${slide.id}',1)" title="Mover →" ${moveRightDisabled?'disabled style="opacity:.3"':''}>›</button>
        <button class="btn btn-icon btn-icon-sm" onclick="duplicateSlide('${post.id}','${slide.id}')" title="Duplicar">+</button>
        <button class="btn btn-icon btn-icon-sm danger" onclick="deleteSlide('${post.id}','${slide.id}')" title="Excluir" ${totalSlides<=1?'disabled style="opacity:.3"':''}>×</button>
      ` : ''}
    </div>
    <div class="slide-frame ${isStory?'story':'feed'}">
      <div class="slide ${isStory?'story':'feed'} bg-${slide.bg} var-${slide.variation||1} ${slide.photo?'has-photo':''}" id="slide-${key.replace(/:/g,'-')}" style="${buildSlideStyle(slide)}">
        ${renderSlideInner(slide, isStory)}
      </div>
    </div>
  `;
  
  // Apply hide/color overrides to the rendered slide
  const slideElForApply = wrap.querySelector('.slide');
  if (slideElForApply) applyHideAndColor(slideElForApply, slide);
  
  // Click on the slide frame to select
  wrap.querySelector('.slide-frame').addEventListener('click', (e) => {
    if (e.target.closest('[contenteditable]')) return;
    if (e.target.closest('button')) return;
    selectSlide(key);
  });
  
  // Attach input listeners to all contenteditable fields (recursive: re-attaches after re-render)
  function attachEditableHandlers(){
    wrap.querySelectorAll('[contenteditable][data-field]').forEach(field => {
      field.addEventListener('blur', onFieldBlur);
    });
  }
  function onFieldBlur(e){
    const field = e.currentTarget;
    const f = field.dataset.field;
    let val = field.innerHTML;
    // Convert <em> back to *...* for storage
    val = italicToAsterisk(val);
    // Save value depending on field type
    if (f === 'sigText'){
      // not stored per-slide currently
    } else if (f.startsWith('item')){
      const i = parseInt(f.slice(4));
      if (!isStory && slide.data.items) slide.data.items[i] = val;
    } else if (f.startsWith('cred')){
      const i = parseInt(f.slice(4));
      if (slide.data.creds) slide.data.creds[i] = val;
    } else if (f.startsWith('rowL')){
      const i = parseInt(f.slice(4));
      if (slide.data.rows) slide.data.rows[i][0] = val;
    } else if (f.startsWith('rowR')){
      const i = parseInt(f.slice(4));
      if (slide.data.rows) slide.data.rows[i][1] = val;
    } else {
      slide.data[f] = val;
    }
    saveState();
    // Re-render to apply asterisk transform AND re-apply hide/color AND re-attach handlers
    const el = wrap.querySelector('.slide');
    if (el){
      el.innerHTML = renderSlideInner(slide, isStory);
      applyHideAndColor(el, slide);
      attachEditableHandlers();
    }
  }
  attachEditableHandlers();
  
  return wrap;
}

function renderPost(post){
  const container = document.createElement('div');
  container.className = 'post';
  container.dataset.postId = post.id;
  const postIdx = STATE.posts.indexOf(post);
  const moveUpDisabled = postIdx === 0;
  const moveDownDisabled = postIdx === STATE.posts.length - 1;
  
  container.innerHTML = `
    <div class="post-head">
      <div class="post-meta">
        <h2><span class="ptag">${post.tag}</span>Post ${post.n} · ${post.tipo}</h2>
        <span class="meta-sub">${post.slides.length} slides</span>
      </div>
      <div class="post-actions">
        <button class="btn btn-icon" onclick="movePost('${post.id}',-1)" title="Mover ↑" ${moveUpDisabled?'disabled style="opacity:.3"':''}>↑</button>
        <button class="btn btn-icon" onclick="movePost('${post.id}',1)" title="Mover ↓" ${moveDownDisabled?'disabled style="opacity:.3"':''}>↓</button>
        <button class="btn" onclick="copyLegenda('${post.id}')">Copiar legenda</button>
        <button class="btn primary" onclick="exportAll('${post.id}')">Baixar tudo</button>

  const slidesEl = container.querySelector(`#slides-${post.id}`);
  post.slides.forEach((slide, idx) => {

function renderStory(story){

        const oldLayout = slide.layout;
        const newDefaults = JSON.parse(JSON.stringify(window.DEFAULT_DATA_FOR[newLayout] || {}));
        
        // Semantic role mapping: each layout field -> standardized role

          'manifesto': {headline:'big', footer:'support'},
          'capa-numero': {label:'eyebrow', numero:'big', headline:'support', sub:'support2'},
          'capa-blocos': {leftWord:'big', rightWord:'big2', footer:'support'},

          'instrutor-card': {nome:'big', papel:'support', bio:'support2'},
          'editorial-split': {tag:'eyebrow', quote:'support2', headline:'big', body:'support'},
          'stat-drop': {topLeft:'eyebrow', topRight:'eyebrow2', stat:'big', context:'support', bottomBar:'footer-tag'},
          'index-card': {capitulo:'eyebrow', pageNum:'eyebrow2', numero:'big', title:'big2', body:'support'},
          'story-manifesto': {label:'eyebrow', headline:'big', sub:'support', cta:'cta'},
          'photo-quote': {quote:'big', attribution:'support'},
          'side-photo': {photoTag:'eyebrow2', eyebrow:'eyebrow', headline:'big', body:'support'},
          'frame': {eyebrow:'eyebrow', headline:'big', sub:'support'},
          'centered': {eyebrow:'eyebrow', headline:'big', body:'support'}
        };
        
        const oldRoles = ROLE_MAP[oldLayout] || {};
        const newRoles = ROLE_MAP[newLayout] || {};
        const roleValues = {};
        for (const oldField in oldRoles){
          if (slide.data[oldField] !== undefined){
            roleValues[oldRoles[oldField]] = slide.data[oldField];
          }
        }
        const merged = {...newDefaults};
        for (const newField in newRoles){
          const role = newRoles[newField];
          if (roleValues[role] !== undefined && typeof roleValues[role] === typeof newDefaults[newField]){
            merged[newField] = roleValues[role];
          }
        }
        // Preserve arrays where field name matches
        for (const k of ['items','rows','creds']){
          if (Array.isArray(slide.data[k]) && Array.isArray(newDefaults[k])){
            merged[k] = slide.data[k];
          }
        }
        
        slide.layout = newLayout;
        slide.data = merged;
        // Adjust variation if new layout has fewer
        const maxVar = (LAYOUT_VARIATIONS[newLayout] || []).length || 1;
        if ((slide.variation || 1) > maxVar) slide.variation = 1;
        saveState();
        renderAll();
        setTimeout(() => renderControls(), 50);
        showToast('Layout trocado');
      });
    }
  }
  
  // Bind events
  bindControls(slide);
}

function bindControls(slide){
  const setScale = document.getElementById('c-text-scale');
  if (setScale){
    setScale.addEventListener('input', e => {
      slide.textScale = parseFloat(e.target.value);
      document.getElementById('c-text-scale-val').textContent = Math.round(slide.textScale*100)+'%';
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el) el.style.setProperty('--text-scale', slide.textScale);
    });
    setScale.addEventListener('change', () => saveState());
  }
  
  // Per-field text size sliders
  controlsPanel.querySelectorAll('.c-ts').forEach(s => {
    s.addEventListener('input', e => {
      if (!slide.textSizes) slide.textSizes = {};
      const fld = s.dataset.fld;
      const val = parseFloat(e.target.value);
      slide.textSizes[fld] = val;
      document.getElementById('c-ts-val-' + fld).textContent = Math.round(val*100) + '%';
      // Apply directly to slide element
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el) el.style.setProperty('--ts-' + fld, val);
    });
    s.addEventListener('change', () => saveState());
  });
  
  // Hide buttons per field
  controlsPanel.querySelectorAll('.c-hide').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!slide.hidden) slide.hidden = {};
      const fld = btn.dataset.fld;
      slide.hidden[fld] = !slide.hidden[fld];
      saveState();
      // Re-render slide and panel
      const slideKey = STATE.selectedKey.replace(/:/g,'-');
      const slideEl = document.getElementById('slide-' + slideKey);
      if (slideEl){
        // Reset display for all this field's elements, then re-apply
        slideEl.querySelectorAll('[data-field="' + fld + '"]').forEach(el => { el.style.display = ''; });
        applyHideAndColor(slideEl, slide);
      }
      renderControls();
    });
  });
  
  // Color pips per field
  controlsPanel.querySelectorAll('.color-pip').forEach(pip => {
    pip.addEventListener('click', () => {
      if (!slide.colors) slide.colors = {};
      const fld = pip.dataset.fld;
      const color = pip.dataset.color;
      slide.colors[fld] = color;
      saveState();
      // Update UI: active state
      controlsPanel.querySelectorAll('.color-pip[data-fld="' + fld + '"]').forEach(p => 
        p.classList.toggle('active', p.dataset.color === color));
      // Apply to slide
      const slideEl = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (slideEl){
        slideEl.querySelectorAll('[data-field="' + fld + '"]').forEach(el => {
          if (color === 'auto'){ el.style.color = ''; }
          else { el.style.color = COLOR_MAP[color] || color; }
        });
      }
    });
  });
  
  // Variation buttons
  controlsPanel.querySelectorAll('[data-var]').forEach(btn => {
    btn.addEventListener('click', () => {
      const variation = parseInt(btn.dataset.var);
      slide.variation = variation;
      // Apply immediately by replacing var-N class on the slide element
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el){
        el.className = el.className.replace(/var-\d+/g,'').trim() + ' var-' + variation;
      }
      // Update active state of buttons
      controlsPanel.querySelectorAll('[data-var]').forEach(x => 
        x.classList.toggle('active', parseInt(x.dataset.var) === variation));
      saveState();
    });
  });
  
  controlsPanel.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      slide.bg = sw.dataset.c;
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el){
        el.className = el.className.replace(/bg-\S+/g,'').trim();
        el.classList.add('bg-' + slide.bg);
      }
      controlsPanel.querySelectorAll('.swatch').forEach(x => x.classList.toggle('active', x.dataset.c === slide.bg));
      saveState();
    });
  });
  
  controlsPanel.querySelectorAll('[data-align]').forEach(b => {
    b.addEventListener('click', () => {
      slide.align = b.dataset.align;
      controlsPanel.querySelectorAll('[data-align]').forEach(x => x.classList.toggle('active', x.dataset.align === slide.align));
      // Re-render the slide content (alignment affects layout)
      const slideEl = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (slideEl){
        // Apply text-align to all major content
        slideEl.querySelectorAll('[class*="l-"]').forEach(l => l.style.textAlign = slide.align);
        // For pull-quote and others, alignment matters
      }
      saveState();
    });
  });
  
  controlsPanel.querySelectorAll('[data-sig]').forEach(b => {
    b.addEventListener('click', () => {
      slide.sigPos = b.dataset.sig;
      controlsPanel.querySelectorAll('[data-sig]').forEach(x => x.classList.toggle('active', x.dataset.sig === slide.sigPos));
      // Re-render slide
      renderAll();
    });
  });
  
  // Ornament chips
  controlsPanel.querySelectorAll('.c-ornament').forEach(b => {
    b.addEventListener('click', () => {
      const o = b.dataset.ornament;
      slide.ornament = (o === 'none') ? null : o;
      controlsPanel.querySelectorAll('.c-ornament').forEach(x => 
        x.classList.toggle('active', x.dataset.ornament === (slide.ornament||'none')));
      saveState();
      renderAll();
    });
  });
  
  // Photo upload
  const fileInput = document.getElementById('c-photo-upload');
  if (fileInput){
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        slide.photo = ev.target.result;
        saveState();
        renderAll();
        showToast('Foto carregada');
      };
      reader.readAsDataURL(file);
    });
  }
  
  // Photo Y
  const photoY = document.getElementById('c-photo-y');
  if (photoY){
    photoY.addEventListener('input', e => {
      slide.photoY = parseInt(e.target.value);
      document.getElementById('c-photo-y-val').textContent = slide.photoY+'%';
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el){
        const px = slide.photoX ?? 50;
        const ph = el.querySelector('.slide-photo');
        if (ph) ph.style.backgroundPosition = `${px}% ${slide.photoY}%`;
        const instPh = el.querySelector('.l-instrutor-card .photo');
        if (instPh) instPh.style.backgroundPosition = `${px}% ${slide.photoY}%`;
      }
    });
    photoY.addEventListener('change', () => saveState());
  }
  
  // Photo X
  const photoX = document.getElementById('c-photo-x');
  if (photoX){
    photoX.addEventListener('input', e => {
      slide.photoX = parseInt(e.target.value);
      document.getElementById('c-photo-x-val').textContent = slide.photoX+'%';
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el){
        const py = slide.photoY ?? 50;
        const ph = el.querySelector('.slide-photo');
        if (ph) ph.style.backgroundPosition = `${slide.photoX}% ${py}%`;
        const instPh = el.querySelector('.l-instrutor-card .photo');
        if (instPh) instPh.style.backgroundPosition = `${slide.photoX}% ${py}%`;
      }
    });
    photoX.addEventListener('change', () => saveState());
  }
  
  // Gallery tabs
  function renderGallery(cat){
    const grid = document.getElementById('gallery-grid');
    if (!grid) return;
    const photos = UNSPLASH_GALLERY[cat] || [];
    grid.innerHTML = photos.map(url => `<div class="gallery-thumb" style="background-image:url('${url}')" data-url="${url}"></div>`).join('');
    grid.querySelectorAll('.gallery-thumb').forEach(t => {
      t.addEventListener('click', () => {
        slide.photo = t.dataset.url;
        saveState();
        renderAll();
        showToast('Foto aplicada');
      });
    });
  }
  // Initial render with first category
  const firstCat = Object.keys(UNSPLASH_GALLERY)[0];
  renderGallery(firstCat);
  document.querySelectorAll('.gallery-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.gallery-tab').forEach(x => x.classList.toggle('active', x === t));
      renderGallery(t.dataset.cat);
    });
  });
  
  // Darken
  const darken = document.getElementById('c-darken');
  if (darken){
    darken.addEventListener('input', e => {
      slide.darken = parseInt(e.target.value);
      document.getElementById('c-darken-val').textContent = slide.darken+'%';
      const el = document.getElementById('slide-' + STATE.selectedKey.replace(/:/g,'-'));
      if (el){
        const d = el.querySelector('.slide-photo-darken');
        if (d) d.style.background = `rgba(0,0,0,${slide.darken/100})`;
      }
    });
    darken.addEventListener('change', () => saveState());
  }
}

// ====================== GLOBAL ACTIONS ======================
window.removePhoto = () => {
  const slide = getSlide(STATE.selectedKey);
  if (!slide) return;
  slide.photo = null;
  saveState();
  renderAll();
};

window.applyPhotoUrl = () => {
  const slide = getSlide(STATE.selectedKey);
  if (!slide) return;
  const url = document.getElementById('c-photo-url').value.trim();
  if (!url) return showToast('Cole uma URL primeiro');
  slide.photo = url;
  saveState();
  renderAll();
  showToast('Foto aplicada');
};

window.resetSlide = () => {
  const slide = getSlide(STATE.selectedKey);
  if (!slide) return;
  slide.textScale = 1;
  slide.textSizes = {};
  slide.colors = {};
  slide.hidden = {};
  slide.align = 'left';
  slide.sigPos = 'bottom';
  slide.photoY = 50;
  slide.photoX = 50;
  slide.darken = 50;
  slide.ornament = null;
  saveState();
  renderAll();
  setTimeout(() => renderControls(), 50);
  showToast('Slide resetado');
};

window.resetAllToOriginal = () => {
  const ok = confirm('Restaurar TUDO aos 6 posts originais? Descarta edições, fotos, cores e textos digitados. Não dá pra desfazer.');
  if (!ok) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  STATE.posts = JSON.parse(INITIAL_POSTS_JSON);
  STATE.stories = JSON.parse(INITIAL_STORIES_JSON);
  STATE.selectedKey = null;
  saveState();
  renderAll();
  setTimeout(() => renderControls(), 50);
  showToast('Posts originais restaurados');
};

window.exportCurrent = () => {
  if (!STATE.selectedKey) return;
  const [type, postId, slideId] = STATE.selectedKey.split(':');
  if (type === 'feed'){
    exportSlide(postId, slideId);
  } else {
    exportStory(postId);
  }
};

window.movePost = (postId, dir) => {
  const idx = STATE.posts.findIndex(p => p.id === postId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= STATE.posts.length) return;
  const [post] = STATE.posts.splice(idx, 1);
  STATE.posts.splice(newIdx, 0, post);
  saveState();
  renderAll();
};

window.deletePost = (postId) => {
  if (!confirm('Excluir este post inteiro?')) return;
  STATE.posts = STATE.posts.filter(p => p.id !== postId);
  if (STATE.selectedKey && STATE.selectedKey.includes(postId)) STATE.selectedKey = null;
  saveState();
  renderAll();
};

window.moveSlide = (postId, slideId, dir) => {
  const post = getPost(postId);
  if (!post) return;
  const idx = post.slides.findIndex(s => s.id === slideId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= post.slides.length) return;
  const [slide] = post.slides.splice(idx, 1);
  post.slides.splice(newIdx, 0, slide);
  saveState();
  renderAll();
};

window.duplicateSlide = (postId, slideId) => {
  const post = getPost(postId);
  if (!post) return;
  const idx = post.slides.findIndex(s => s.id === slideId);
  if (idx === -1) return;
  const clone = JSON.parse(JSON.stringify(post.slides[idx]));
  clone.id = 's' + Date.now();
  post.slides.splice(idx+1, 0, clone);
  saveState();
  renderAll();
};

window.deleteSlide = (postId, slideId) => {
  const post = getPost(postId);
  if (!post || post.slides.length <= 1) return;
  post.slides = post.slides.filter(s => s.id !== slideId);
  if (STATE.selectedKey && STATE.selectedKey.includes(slideId)) STATE.selectedKey = null;
  saveState();
  renderAll();
};

window.addSlide = (postId) => {
  const post = getPost(postId);
  if (!post) return;
  const newSlide = {
    id: 's' + Date.now(),
    layout: 'manifesto',
    bg: 'navy',
    data: JSON.parse(JSON.stringify(window.DEFAULT_DATA_FOR['manifesto'])),
    photo: null, photoY: 50, photoX: 50, darken: 50, textScale: 1.0, align: 'left', sigPos: 'bottom',
    textSizes: {}
  };
  post.slides.push(newSlide);
  saveState();
  renderAll();
};

window.copyLegenda = (postId) => {
  const post = getPost(postId);
  if (!post) return;
  navigator.clipboard.writeText(post.legenda).then(() => showToast('Legenda copiada!'));
};

window.DEFAULT_DATA_FOR = DEFAULT_DATA_FOR;

// ====================== EXPORT ======================
async function exportSlide(postId, slideId){
  const el = document.getElementById(`slide-feed-${postId}-${slideId}`);
  if (!el) return;
  showToast(`Gerando…`);
  // Temporarily strip 'selected' class from ALL frames to remove any transforms
  // that would break position:fixed contexts on .capturing
  const wasSelected = [];
  document.querySelectorAll('.slide-frame.selected').forEach(f => {
    wasSelected.push(f);
    f.classList.remove('selected');
  });
  el.classList.add('capturing');
  await new Promise(r => setTimeout(r, 150));
  try {
    const canvas = await html2canvas(el, {
      width:1080, height:1350, windowWidth:1080, windowHeight:1350,
      backgroundColor:null, scale:1, useCORS:true, logging:false
    });
    el.classList.remove('capturing');
    wasSelected.forEach(f => f.classList.add('selected'));
    const link = document.createElement('a');
    const post = getPost(postId);
    const idx = post.slides.findIndex(s => s.id === slideId);
    link.download = `sentinela-P${post.n}-slide${idx+1}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Salvo!');
  } catch(err){
    el.classList.remove('capturing');
    wasSelected.forEach(f => f.classList.add('selected'));
    console.error(err);
    showToast('Erro ao salvar');
  }
}
window.exportSlide = exportSlide;

async function exportStory(storyId){
  const el = document.getElementById(`slide-story-${storyId}-0`);
  if (!el) return;
  showToast('Gerando story…');
  const wasSelected = [];
  document.querySelectorAll('.slide-frame.selected').forEach(f => {
    wasSelected.push(f);
    f.classList.remove('selected');
  });
  el.classList.add('capturing');
  await new Promise(r => setTimeout(r, 150));
  try {
    const canvas = await html2canvas(el, {
      width:1080, height:1920, windowWidth:1080, windowHeight:1920,
      backgroundColor:null, scale:1, useCORS:true, logging:false
    });
    el.classList.remove('capturing');
    wasSelected.forEach(f => f.classList.add('selected'));
    const story = STATE.stories.find(s => s.id === storyId);
    const link = document.createElement('a');
    link.download = `sentinela-story${story.n}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Salvo!');
  } catch(err){
    el.classList.remove('capturing');
    wasSelected.forEach(f => f.classList.add('selected'));
    console.error(err);
    showToast('Erro ao salvar');
  }
}
window.exportStory = exportStory;

window.exportAll = async (postId) => {
  const post = getPost(postId);
  if (!post) return;
  for (const slide of post.slides){
    await exportSlide(postId, slide.id);
    await new Promise(r => setTimeout(r, 300));
  }
  showToast('Todos baixados!');
};

// ====================== TABS ======================
document.querySelectorAll('.app-tab[data-tab]').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.app-tab[data-tab]').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + t.dataset.tab));
    STATE.tab = t.dataset.tab;
  });
});

// ====================== INIT ======================
// Clean up old storage keys from previous versions to avoid stale state
['sentinela_postmaker_v4','sentinela_postmaker_v5','sentinela_postmaker_v6','sentinela_postmaker_v7'].forEach(k => {
  try { localStorage.removeItem(k); } catch(e){}
});
loadState();
renderAll();

// Mobile: collapse controls panel by default, expand on tap
if (window.innerWidth <= 980){
  controlsPanel.classList.add('collapsed');
  // Tap on the head toggles
  controlsPanel.addEventListener('click', (e) => {
    if (e.target.closest('.ctrl-head') || (controlsPanel.classList.contains('collapsed') && controlsPanel.scrollTop === 0)){
      controlsPanel.classList.toggle('collapsed');
    }
  });
}

// When a slide is selected on mobile, expand controls
const origSelect = selectSlide;
window.selectSlide = function(key){
  origSelect(key);
  if (window.innerWidth <= 980) controlsPanel.classList.remove('collapsed');
};

</script>
